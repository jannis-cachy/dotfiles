label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(255, 255, 255)
    font_size = 160
    font_family = Oxanium Light
    position = 0, 190
    halign = center
    valign = center
}

label {
    text = cmd[update:60000] date +"%A, %d. %B %Y"
    color = rgba(255, 255, 255, 0.7)
    font_size = 28
    font_family = Oxanium
    position = 0, 80
    halign = center
    valign = center
}
