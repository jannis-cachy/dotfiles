$text = rgb(255, 255, 255)
$subtext = rgba(255, 255, 255, 0.7)
$accent = rgb(198, 40, 40)
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
}

# no monitor line means every screen, file is written by the quickshell wallpaper picker
background {
    color = rgb(20, 20, 24)
    path = ~/.local/state/quickshell/lock-wallpaper.png
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

# clock style (normal or Persona 5) is copied here by the quickshell wallpaper picker
source = ~/.local/state/quickshell/lock-clock.conf

input-field {
    size = 320, 54
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.45)
    outer_color = $accent
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = $accent
    fade_on_empty = false
    placeholder_text =
    fail_text = wrong password
    rounding = 12
    position = 0, -40
    halign = center
    valign = center
}
